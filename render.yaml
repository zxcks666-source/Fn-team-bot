services:
  - type: web
    name: fn-team-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DB_PATH
        value: /opt/render/project/src/fn_teams.db
      - key: PYTHON_VERSION
        value: 3.11.0
